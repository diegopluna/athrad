[workspace]
resolver = "3"
members = ["ir", "subset", "frontend", "codegen", "link", "oracle", "athrad"]
exclude = ["oracle/crates"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ir = { path = "ir" }
frontend = { path = "frontend" }
subset = { path = "subset" }
codegen = { path = "codegen" }
link = { path = "link" }
athrad = { path = "athrad" }
anyhow = "1"
cc = "1.10"
cranelift-codegen = { version = "0.137.1", features = ["enable-serde"] }
cranelift-frontend = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
cranelift-object = "0.137.1"
gimli = { version = "0.33", default-features = false, features = ["write"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# kqueue on macOS, not FSEvents: FSEvents batches changes behind a latency.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
object = { version = "0.40", default-features = false, features = ["write"] }
target-lexicon = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
