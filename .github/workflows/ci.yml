name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The three shores. A backend that only exists on one of them is out.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the rustc Athrad drives through rustc-dev.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustc-dev, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - run: rustc -vV
      # The oracle compiles each program with this same rustc and diffs the runs.
      - run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustc-dev, llvm-tools, rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
