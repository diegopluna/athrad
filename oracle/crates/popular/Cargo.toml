# athrad: may-reject-on-windows (threads need landing pads)
# Popular crates from crates.io (no proc macros), used together, for the
# oracle: a program that has to behave the same built by rustc and Athrad.
[package]
name = "popular"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1"
anyhow = "1"
arrayvec = "0.7"
base64 = "0.22"
bitflags = "2"
bytes = "1"
crossbeam-channel = "0.5"
fastrand = "2"
hashbrown = "0.15"
hex = "0.4"
indexmap = "2"
itoa = "1"
memchr = "2"
num-traits = "0.2"
once_cell = "1"
parking_lot = "0.12"
rand = "0.9"
regex = "1"
ryu = "1"
semver = "1"
smallvec = "1"
strsim = "0.11"
textwrap = "0.16"
unicode-segmentation = "1"

[workspace]
